name: Build Custom Sing-box

on:
  schedule:
    - cron: '0 0 * * 0' # 每周日午夜 00:00 (UTC) 自动触发
  workflow_dispatch: # 允许在 GitHub 网页端手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许 GITHUB_TOKEN 创建 Release 权限

    steps:
      - name: 获取官方最新版本号
        id: get_version
        run: |
          LATEST_TAG=$(curl -sL https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r ".tag_name")
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "当前官方最新版本是 $LATEST_TAG"

      - name: 检查当前仓库是否已编译过该版本
        id: check_release
        run: |
          if gh release view "${{ steps.get_version.outputs.tag }}-custom" &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "🚨 该版本 (${{ steps.get_version.outputs.tag }}-custom) 已编译过，跳过本次构建。"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 检出官方源码
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ steps.get_version.outputs.tag }}
          fetch-depth: 0

      - name: 配置 Go 环境
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.0' # Sing-box 通常需要较新的 Go 版本
          cache: true

      - name: 编译定制版 Sing-box
        if: steps.check_release.outputs.exists == 'false'
        run: |
          echo "开始编译 ${{ steps.get_version.outputs.tag }} ..."
          CGO_ENABLED=0 go build -v -trimpath \
          -tags with_utls,with_v2ray_api,with_quic,with_wireguard,with_gvisor,with_clash_api \
          -ldflags "-X \"github.com/sagernet/sing-box/constant.Version=${{ steps.get_version.outputs.tag }}\" -s -w" \
          -o sing-box-linux-amd64 ./cmd/sing-box
          
          # 如果需要其他架构 (比如 arm64)，可以取消下面的注释
          # GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -v -trimpath -tags with_utls,with_v2ray_api,with_quic,with_wireguard,with_gvisor,with_clash_api -ldflags "-X \"github.com/sagernet/sing-box/constant.Version=${{ steps.get_version.outputs.tag }}\" -s -w" -o sing-box-linux-arm64 ./cmd/sing-box

      - name: 创建 Release 并上传二进制文件
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}-custom
          name: Sing-box ${{ steps.get_version.outputs.tag }} (定制版)
          body: |
            🤖 **自动化定时构建**
            官方原版: [${{ steps.get_version.outputs.tag }}](https://github.com/SagerNet/sing-box/releases/tag/${{ steps.get_version.outputs.tag }})
            
            **编译包含的特性 (Tags):** 
            `with_utls`, `with_v2ray_api`, `with_quic`, `with_wireguard`, `with_gvisor`, `with_clash_api`
          files: |
            sing-box-linux-amd64
            # sing-box-linux-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
